<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Etch-A-Sketch</title>
    <link rel="icon" type="image/png" href="heart.png" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- ETCH-A-SKETCH GAME -->
    <div class="app">
      <!-- HEADING -->
      <h1 class="title">ETCH-A-SKETCH</h1>

      <!-- GAME SETTINGS -->
      <div class="game">
        <div class="settings">
          <h2>Settings</h2>

          <div class="options">
            <!--  COLOR -->
            <div class="color">
              <h4>Color</h4>
              <input type="color" class="color_picker" />
            </div>

            <!-- GRID SIZE -->
            <div class="grid">
              <h4>
                Grid Size: <span class="row">1</span>x<span class="column"
                  >1</span
                >
              </h4>
              <input
                type="range"
                min="1"
                max="16"
                step="1"
                value="1"
                class="slider"
              />
            </div>

            <!-- GRID LINES -->
            <div class="buttons">
              <div class="btn">
                <button class="btn gridLines">GRID LINES</button>
              </div>

              <!-- RAINBOW -->
              <div class="btn">
                <button class="btn rainbow">RAINBOW</button>
              </div>

              <!-- DARKEN -->
              <div class="btn">
                <button class="btn darken">DARKEN</button>
              </div>

              <!-- LIGHTEN -->
              <div class="btn">
                <button class="btn lighten">LIGHTEN</button>
              </div>

              <!-- ERASE -->
              <div class="btn">
                <button class="btn eraser">ERASER</button>
              </div>

              <!-- CLEAR -->
              <div class="btn">
                <button class="btn clear">CLEAR</button>
              </div>
            </div>
          </div>
        </div>
        <div class="grid_container"></div>
      </div>
    </div>
    <footer>
      <p class="footer">Copyright &copy KiesheaH</p>
      <ion-icon name="logo-github" class="github"></ion-icon>
    </footer>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
